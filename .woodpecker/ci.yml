when:
  - event: [pull_request, manual]

labels:
  backend: local

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      lfs: false
      partial: false

matrix:
  PYTHON_VERSION: ["3.10", "3.11", "3.12"]

steps:
  host-toolchain:
    image: /usr/bin/bash
    environment:
      PATH: /opt/avia/toolchains/node-v22.12.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/dbcloud/.local/bin:/mnt/data/avia/wheelhouse/bin
    commands:
      - |
        printf '%s  %s\n' fec5345445da9a18a4eb834db24218d94ecd5116734c92b928c4f2a2710725a2 /usr/local/bin/avia-verify-woodpecker-local-toolchain \
          | sha256sum --check --strict -
        /usr/bin/bash --noprofile --norc /usr/local/bin/avia-verify-woodpecker-local-toolchain

  quality:
    image: /usr/bin/bash
    depends_on: [host-toolchain]
    environment:
      PATH: /opt/avia/toolchains/node-v22.12.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/dbcloud/.local/bin:/mnt/data/avia/wheelhouse/bin
      UV_CACHE_DIR: /mnt/data/avia/cache/uv
      UV_LINK_MODE: hardlink
      UV_PYTHON_INSTALL_DIR: /mnt/data/avia/python
      UV_PYTHON_DOWNLOADS: never
    commands:
      - uv sync --python ${PYTHON_VERSION} --frozen --all-packages --group dev
      - uv run --python ${PYTHON_VERSION} ruff check packages tests
      - uv run --python ${PYTHON_VERSION} ruff format --check packages tests
      - uv run --python ${PYTHON_VERSION} python -W error -m compileall -q -f packages/avia-cli/src/avia_cli tests
      - uv run --python ${PYTHON_VERSION} pytest -p no:cacheprovider -q

  package:
    image: /usr/bin/bash
    depends_on: [quality]
    environment:
      PATH: /opt/avia/toolchains/node-v22.12.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/dbcloud/.local/bin:/mnt/data/avia/wheelhouse/bin
      UV_CACHE_DIR: /mnt/data/avia/cache/uv
      UV_LINK_MODE: hardlink
      UV_PYTHON_INSTALL_DIR: /mnt/data/avia/python
      UV_PYTHON_DOWNLOADS: never
    when:
      - matrix:
          PYTHON_VERSION: "3.12"
    commands:
      - |
        build_dir="$(mktemp -d /tmp/avia-cli-dist.XXXXXX)"
        trap 'rm -rf "$${build_dir}"' EXIT
        uv build --package avia-cli --out-dir "$${build_dir}"
        test "$(find "$${build_dir}" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
        test "$(find "$${build_dir}" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
